<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Globe circle -->
  <circle cx="96" cy="96" r="82" fill="#D8EAF8" stroke="#5A9ED4" stroke-width="3"/>

  <!-- Globe latitude lines -->
  <ellipse cx="96" cy="96" rx="82" ry="28" stroke="#5A9ED4" stroke-width="1.8" fill="none"/>
  <ellipse cx="96" cy="96" rx="82" ry="56" stroke="#5A9ED4" stroke-width="1.8" fill="none"/>
  <!-- Globe longitude lines -->
  <ellipse cx="96" cy="96" rx="32" ry="82" stroke="#5A9ED4" stroke-width="1.8" fill="none"/>
  <ellipse cx="96" cy="96" rx="60" ry="82" stroke="#5A9ED4" stroke-width="1.8" fill="none"/>
  <!-- Equator (horizontal) -->
  <line x1="14" y1="96" x2="178" y2="96" stroke="#5A9ED4" stroke-width="1.8"/>

  <!-- Building body -->
  <rect x="60" y="68" width="72" height="88" rx="3" fill="#3A6FA8" stroke="#2A5A90" stroke-width="2"/>
  <!-- Building base -->
  <rect x="52" y="148" width="88" height="12" rx="2" fill="#2A5A90"/>

  <!-- Building windows (3 columns x 4 rows) -->
  <!-- Row 1 -->
  <rect x="68" y="76" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <rect x="89" y="76" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <rect x="110" y="76" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <!-- Row 2 -->
  <rect x="68" y="96" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <rect x="89" y="96" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <rect x="110" y="96" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <!-- Row 3 -->
  <rect x="68" y="116" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <rect x="89" y="116" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <rect x="110" y="116" width="14" height="12" rx="2" fill="#A8D4F0"/>
  <!-- Door -->
  <rect x="84" y="132" width="24" height="24" rx="2" fill="#1E4A78"/>

  <!-- Green "+" badge (bottom-right of globe) -->
  <circle cx="155" cy="155" r="26" fill="#4CAF50" stroke="white" stroke-width="3"/>
  <!-- Plus sign -->
  <line x1="155" y1="142" x2="155" y2="168" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="142" y1="155" x2="168" y2="155" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
