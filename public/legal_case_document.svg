<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#d97706;stop-opacity:0.95" />
      <stop offset="70%" style="stop-color:#b45309;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:0.85" />
    </linearGradient>
    <linearGradient id="redTabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="blueTabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="greenTabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fefefe;stop-opacity:0.98" />
      <stop offset="100%" style="stop-color:#f9fafb;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  
  <!-- Main Case Files Stack -->
  <g transform="translate(30,40)">
    <!-- Bottom File Folder -->
    <rect x="0" y="25" width="80" height="55" fill="url(#folderGradient)" opacity="0.8" rx="3"/>
    <rect x="2" y="27" width="76" height="51" fill="url(#paperGradient)" opacity="0.9" rx="2"/>
    
    <!-- Bottom File Tab -->
    <rect x="15" y="20" width="25" height="10" fill="url(#redTabGradient)" rx="2"/>
    <rect x="16" y="21" width="23" height="8" fill="url(#folderGradient)" opacity="0.2" rx="1"/>
    
    <!-- Middle File Folder -->
    <rect x="8" y="15" width="80" height="55" fill="url(#folderGradient)" opacity="0.9" rx="3"/>
    <rect x="10" y="17" width="76" height="51" fill="url(#paperGradient)" opacity="0.8" rx="2"/>
    
    <!-- Middle File Tab -->
    <rect x="25" y="10" width="25" height="10" fill="url(#blueTabGradient)" rx="2"/>
    <rect x="26" y="11" width="23" height="8" fill="url(#folderGradient)" opacity="0.2" rx="1"/>
    
    <!-- Top File Folder -->
    <rect x="16" y="5" width="80" height="55" fill="url(#folderGradient)" rx="3"/>
    <rect x="18" y="7" width="76" height="51" fill="url(#paperGradient)" opacity="0.8" rx="2"/>
    
    <!-- Top File Tab -->
    <rect x="35" y="0" width="25" height="10" fill="url(#greenTabGradient)" rx="2"/>
    <rect x="36" y="1" width="23" height="8" fill="url(#folderGradient)" opacity="0.2" rx="1"/>
    
    <!-- File Labels on Tabs (Small rectangles to suggest text) -->
    <rect x="38" y="3" width="8" height="1.5" fill="url(#folderGradient)" opacity="0.6" rx="0.3"/>
    <rect x="47" y="3" width="6" height="1.5" fill="url(#folderGradient)" opacity="0.6" rx="0.3"/>
    
    <rect x="28" y="13" width="8" height="1.5" fill="url(#folderGradient)" opacity="0.6" rx="0.3"/>
    <rect x="37" y="13" width="6" height="1.5" fill="url(#folderGradient)" opacity="0.6" rx="0.3"/>
    
    <rect x="18" y="23" width="8" height="1.5" fill="url(#folderGradient)" opacity="0.6" rx="0.3"/>
    <rect x="27" y="23" width="6" height="1.5" fill="url(#folderGradient)" opacity="0.6" rx="0.3"/>
  </g>
  
  <!-- Additional Side Files -->
  <g transform="translate(15,90)">
    <!-- Left Side File -->
    <rect x="0" y="0" width="25" height="35" fill="url(#folderGradient)" opacity="0.7" rx="2"/>
    <rect x="1" y="1" width="23" height="33" fill="url(#paperGradient)" opacity="0.7" rx="1"/>
    
    <!-- Left Side Tab -->
    <rect x="5" y="-3" width="8" height="6" fill="url(#blueTabGradient)" opacity="0.8" rx="1"/>
    <rect x="6" y="-2" width="6" height="4" fill="url(#folderGradient)" opacity="0.2" rx="0.5"/>
  </g>
  
  <g transform="translate(110,90)">
    <!-- Right Side File -->
    <rect x="0" y="0" width="25" height="35" fill="url(#folderGradient)" opacity="0.7" rx="2"/>
    <rect x="1" y="1" width="23" height="33" fill="url(#paperGradient)" opacity="0.7" rx="1"/>
    
    <!-- Right Side Tab -->
    <rect x="5" y="-3" width="8" height="6" fill="url(#redTabGradient)" opacity="0.8" rx="1"/>
    <rect x="6" y="-2" width="6" height="4" fill="url(#folderGradient)" opacity="0.2" rx="0.5"/>
  </g>
</svg>