<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#374151;stop-opacity:0.95" />
      <stop offset="70%" style="stop-color:#6b7280;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:0.85" />
    </linearGradient>
    <radialGradient id="windowGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.9" />
      <stop offset="60%" style="stop-color:#bfdbfe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:0.7" />
    </radialGradient>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Ground/Base -->
  <rect x="10" y="135" width="130" height="8" fill="url(#buildingGradient)" opacity="0.6" rx="1"/>
  
  <!-- Main Building Structure -->
  <rect x="30" y="40" width="90" height="95" fill="url(#buildingGradient)" rx="2"/>
  
  <!-- Building Entrance -->
  <rect x="65" y="115" width="20" height="20" fill="url(#windowGradient)" opacity="0.8" rx="1"/>
  
  <!-- Entrance Steps -->
  <rect x="60" y="130" width="30" height="3" fill="url(#buildingGradient)" opacity="0.8"/>
  <rect x="62" y="127" width="26" height="3" fill="url(#buildingGradient)" opacity="0.9"/>
  
  <!-- Office Windows - Grid Pattern -->
  <!-- Floor 1 -->
  <rect x="38" y="100" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="55" y="100" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="83" y="100" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="100" y="100" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  
  <!-- Floor 2 -->
  <rect x="38" y="85" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="55" y="85" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="72" y="85" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="89" y="85" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="100" y="85" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  
  <!-- Floor 3 -->
  <rect x="38" y="70" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="55" y="70" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="72" y="70" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="89" y="70" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="100" y="70" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  
  <!-- Floor 4 -->
  <rect x="38" y="55" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="55" y="55" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="72" y="55" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="89" y="55" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  <rect x="100" y="55" width="12" height="8" fill="url(#windowGradient)" opacity="0.95" rx="1"/>
  
  <!-- Rooftop Structure -->
  <rect x="35" y="35" width="80" height="8" fill="url(#roofGradient)" rx="1"/>
  
  <!-- Building Sign/Logo Area -->
  <rect x="68" y="45" width="14" height="6" fill="url(#buildingGradient)" opacity="0.9" rx="1"/>
  
  <!-- Side Wing/Annex -->
  <rect x="122" y="60" width="18" height="75" fill="url(#buildingGradient)" opacity="0.9" rx="1"/>
  
  <!-- Side Wing Windows -->
  <rect x="126" y="110" width="8" height="6" fill="url(#windowGradient)" opacity="0.9" rx="1"/>
  <rect x="126" y="95" width="8" height="6" fill="url(#windowGradient)" opacity="0.9" rx="1"/>
  <rect x="126" y="80" width="8" height="6" fill="url(#windowGradient)" opacity="0.9" rx="1"/>
  <rect x="126" y="65" width="8" height="6" fill="url(#windowGradient)" opacity="0.9" rx="1"/>
  
  <!-- Decorative Elements -->
  <!-- Building Corner Pillars -->
  <rect x="28" y="40" width="4" height="95" fill="url(#roofGradient)" opacity="0.8"/>
  <rect x="118" y="40" width="4" height="95" fill="url(#roofGradient)" opacity="0.8"/>
  
  <!-- Entrance Canopy -->
  <rect x="58" y="112" width="34" height="3" fill="url(#roofGradient)" opacity="0.9" rx="1"/>
  
  <!-- Professional Signage -->
  <circle cx="75" cy="48" r="4" fill="url(#buildingGradient)" opacity="0.8"/>
  <rect x="73" cy="46" width="4" height="4" fill="url(#roofGradient)" opacity="0.9"/>
</svg>