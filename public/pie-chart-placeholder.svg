  <rect x="163" y="53" width="30" height="8" rx="4" fill="#e2e8f0"/>

  <!-- InProgress -->
  <circle cx="152" cy="77" r="5.5" fill="#fcd34d"/>
  <rect x="163" y="73" width="24" height="8" rx="4" fill="#e2e8f0"/>

