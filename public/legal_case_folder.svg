<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions for realistic manila folder appearance -->
  <defs>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CD853F;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="documentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F8F8FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tabGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A460;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Main folder with realistic manila color -->
  <path d="M8 12C8 10.8954 8.89543 10 10 10H18L20 12H38C39.1046 12 40 12.8954 40 14V36C40 37.1046 39.1046 38 38 38H10C8.89543 38 8 37.1046 8 36V12Z" 
        fill="url(#folderGradient)" 
        stroke="#B8860B" 
        stroke-width="0.8"/>
  
  <!-- Folder tab with slightly different shade -->
  <path d="M18 10L20 12H38C39.1046 12 40 12.8954 40 14H8V12C8 10.8954 8.89543 10 10 10H18Z" 
        fill="url(#tabGradient)"/>
  
  <!-- Legal document pages inside folder with subtle shadow -->
  <rect x="13" y="19" width="22" height="14" rx="1" 
        fill="#E0E0E0" 
        fill-opacity="0.4"/>
  <rect x="12" y="18" width="22" height="14" rx="1" 
        fill="url(#documentGradient)" 
        stroke="#D3D3D3" 
        stroke-width="0.6"/>
  
  <!-- Document lines representing text with realistic black text -->
  <line x1="15" y1="22" x2="28" y2="22" stroke="#333333" stroke-width="0.6" stroke-opacity="0.8"/>
  <line x1="15" y1="25" x2="30" y2="25" stroke="#333333" stroke-width="0.6" stroke-opacity="0.8"/>
  <line x1="15" y1="28" x2="27" y2="28" stroke="#333333" stroke-width="0.6" stroke-opacity="0.8"/>
  <line x1="15" y1="31" x2="24" y2="31" stroke="#333333" stroke-width="0.6" stroke-opacity="0.8"/>
  
  <!-- Small legal badge/seal in corner with gold accent -->
  <circle cx="35" cy="18" r="4" 
          fill="#FFD700" 
          fill-opacity="0.2" 
          stroke="#DAA520" 
          stroke-width="0.8"/>
  
  <!-- Simple legal symbol inside badge -->
  <g transform="translate(35, 18)" opacity="0.7">
    <!-- Simplified balance symbol in dark color -->
    <line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#8B4513" stroke-width="0.8"/>
    <line x1="-1.5" y1="-1" x2="1.5" y2="-1" stroke="#8B4513" stroke-width="0.8"/>
    <circle cx="-1.2" cy="-1" r="0.6" fill="none" stroke="#8B4513" stroke-width="0.6"/>
    <circle cx="1.2" cy="-1" r="0.6" fill="none" stroke="#8B4513" stroke-width="0.6"/>
  </g>
</svg>